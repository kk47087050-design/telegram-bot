name: Auto Update Sitemap Lastmod

on:
  push:
    branches:
      - main # 如果你的主分支名称叫 master，请修改为 master

permissions:
  contents: write # 赋予 Actions 修改并提交文件的权限

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update lastmod date in sitemap.xml
        run: |
          # 获取当前 UTC 日期，格式如：YYYY-MM-DD
          TODAY=$(date -u +'%Y-%m-%d')
          # 使用 sed 替换 sitemap.xml 中的 <lastmod> 日期
          sed -i -E "s/<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}<\/lastmod>/<lastmod>${TODAY}<\/lastmod>/g" sitemap.xml

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          
          # 检查是否有文件改动，如果有改动则提交并推送
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto update sitemap lastmod date"
            git push
          else
            echo "No changes in sitemap.xml"
          fi
